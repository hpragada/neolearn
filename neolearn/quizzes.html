<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#0a0a0a;
  color:white;
}

h1{text-align:center;margin-top:20px;}

/* MODULES */
#mainModules, #subModules{
  display:flex;
  gap:20px;
  padding:30px;
}

.module{
  flex:1;
  padding:40px;
  background:#111;
  border-radius:15px;
  text-align:center;
  cursor:pointer;
  transition:0.3s;
}
.module:hover{
  background:#00f5c4;
  color:black;
  transform:scale(1.05);
}

/* EXPLAIN */
#explain{
  display:none;
  padding:20px;
  margin:20px;
  background:#111;
  border-radius:10px;
}

/* QUIZ */
#quiz{display:none;padding:20px;}

.question{
  background:#111;
  padding:20px;
  border-radius:10px;
}

.options button{
  width:100%;
  margin:8px 0;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#222;
  color:white;
  cursor:pointer;
}
.options button:hover{
  background:#00f5c4;
  color:black;
}

#topBar{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

#progress{
  height:6px;
  background:#00f5c4;
  width:0%;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#00f5c4;
}

/* SCOREBOARD */
#scoreBoard{
  display:none;
  text-align:center;
  padding:30px;
}

// VARIABLES
let currentModule,currentTopic,questions,index,answers,time,timer;

// MODULE
function openModule(mod){
  currentModule=mod;
  document.getElementById("mainModules").style.display="none";

  let sub=document.getElementById("subModules");
  sub.innerHTML="";
  sub.style.display="flex";

  Object.keys(data[mod]).forEach(t=>{
    sub.innerHTML+=`<div class="module" onclick="showExplain('${t}')">${t}</div>`;
  });
}

// EXPLAIN
function showExplain(topic){
  currentTopic=topic;
  document.getElementById("explain").style.display="block";

  document.getElementById("topicTitle").innerText=topic;
  document.getElementById("topicDesc").innerHTML=
    data[currentModule][topic].desc.replace(/\n/g,"<br><br>");
}

// START
function startQuiz(){
  document.getElementById("quiz").style.display="block";

  questions=data[currentModule][currentTopic].q;
  index=0; answers=[]; time=600;

  loadQ();
  clearInterval(timer);
  timer=setInterval(updateTimer,1000);
}

// LOAD Q
function loadQ(){
  let q=questions[index];
  let html=`<b>Q${index+1}:</b> ${q.q}<div class="options">`;

  q.o.forEach(opt=>{
    html+=`<button onclick="selectAns('${opt}')">${opt}</button>`;
  });

  html+=`</div>`;
  document.getElementById("questionBox").innerHTML=html;

  document.getElementById("progress").style.width=
    ((index+1)/10*100)+"%";
}

// SELECT
function selectAns(a){answers[index]=a;}

// NAV
function nextQ(){ index<9 ? (index++,loadQ()) : showResult(); }
function prevQ(){ if(index>0){index--;loadQ();} }

// TIMER
function updateTimer(){
  let m=Math.floor(time/60),s=time%60;
  document.getElementById("timer").innerText=`Time: ${m}:${s}`;
  time--;
  if(time<=0){clearInterval(timer);showResult();}
}

// RESULT
function showResult(){
  clearInterval(timer);

  let score=answers.filter((a,i)=>a===questions[i].a).length;
  let percent=Math.round(score/10*100);

  document.getElementById("quiz").style.display="none";
  document.getElementById("scoreBoard").style.display="block";

  document.getElementById("finalScore").innerText=`Score: ${score}/10`;
  document.getElementById("finalPercent").innerText=`${percent}% Performance`;
}
  // SAVE FIREBASE
 const userId = firebase.auth().currentUser.uid;
const userRef = db.collection("users").doc(userId);

userRef.set({
    quizProgress: {
        [currentModule + "_" + currentTopic]: {
            score,
            percent,
            date: new Date().toISOString()
        }
    }
}, { merge: true });

// Update totalScore
userRef.get().then(doc => {
    const quizzes = doc.data().quizProgress || {};
    let total = 0;
    Object.values(quizzes).forEach(q => total += q.score);
    userRef.update({ totalScore: total });
});

// CHART
// ===== UPDATE QUIZ SCORE =====
function updateScore(subject, score){
  // 1️⃣ Save to Firebase
  const quizProgress = {};
  quizProgress[subject] = { percent: score }; // e.g., { FLAT: {percent: 8} }

  userRef.set({
    quizProgress: quizProgress
  }, { merge: true }) // merge keeps other subjects intact
  .then(()=>{
    console.log("Score saved to dashboard!");
    loadChart(score);       // 2️⃣ Update chart immediately
    loadUser();             // 3️⃣ Refresh dashboard subject %
  })
  .catch(err=>console.error(err));
}

// ===== CHART =====
function loadChart(score){
  if(window.chart) window.chart.destroy();

  window.chart = new Chart(document.getElementById("chart"),{
    type:"doughnut",
    data:{
      labels:["Score","Remaining"],
      datasets:[{
        data:[score, 10-score],
        backgroundColor:["#00f5c4","#161b22"]
      }]
    },
    options:{
      responsive:true,
      plugins:{
        legend:{position:'bottom'}
      }
    }
  });
}

// BACK BUTTON
function goHome(){
  showDash(); // shows dashboard instead of reload
}
