<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>

/* ===== GLOBAL ===== */
body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#0d1117,#1f2937);
  color:white;
  display:flex;
  height:100vh;
}

/* ===== SIDEBAR ===== */
.sidebar{
  width:230px;
  background: rgba(22,27,34,0.9);
  backdrop-filter: blur(15px);
  padding:20px;
  border-right:1px solid rgba(255,255,255,0.1);
}

.sidebar h3{
  text-align:center;
  margin-bottom:20px;
  color:#00f5c4;
}

/* 🔥 PREMIUM BUTTON */
.sidebar button{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  background: linear-gradient(135deg,#1f2937,#111827);
  color:white;
  transition: all 0.3s ease;
  position:relative;
  overflow:hidden;
}

/* SHINE EFFECT */
.sidebar button::before{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background: linear-gradient(120deg,transparent,rgba(255,255,255,0.3),transparent);
  transition:0.5s;
}

.sidebar button:hover::before{
  left:100%;
}

.sidebar button:hover{
  transform:translateY(-2px) scale(1.02);
  box-shadow:0 0 15px rgba(0,245,196,0.4);
}

/* LOGOUT SPECIAL */
.logout{
  background: linear-gradient(135deg,#ff4d6d,#c9184a);
}

/* ===== MAIN ===== */
.main{
  flex:1;
  padding:25px;
  overflow-y:auto;
}

/* ===== CARD ===== */
.card{
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
  padding:20px;
  border-radius:15px;
  margin-bottom:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
  border:1px solid rgba(255,255,255,0.1);
}

/* ===== GRID ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

/* ===== SUBJECT CARD ===== */
.subject{
  background: rgba(255,255,255,0.07);
  padding:20px;
  border-radius:15px;
  text-align:center;
  transition:0.3s;
  border:1px solid rgba(255,255,255,0.1);
}

.subject:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px rgba(0,245,196,0.3);
}

.subject h3{
  margin-bottom:10px;
  color:#00f5c4;
}

/* ===== CHART ===== */

/* ===== PROFILE ===== */
#profile{
  max-width:400px;
}

#profile input{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  border-radius:10px;
  border:none;
  outline:none;
  background: rgba(255,255,255,0.08);
  color:white;
  font-size:14px;
}

#profile input:focus{
  box-shadow:0 0 10px rgba(0,245,196,0.5);
}

/* SAVE BUTTON */
#profile button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background: linear-gradient(135deg,#00f5c4,#00c2a8);
  color:black;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

#profile button:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px rgba(0,245,196,0.5);
}
canvas{
  display:block;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h3>NeoLearn</h3>
  <button onclick="showDash()">Dashboard</button>
  <button onclick="showProfile()">Profile</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<!-- MAIN -->
<div class="main">

<!-- DASHBOARD -->
<div id="dash">

  <!-- USER INFO -->
  <div class="card">
    <h2 id="name">Loading...</h2>
    <p id="email"></p>
  </div>

  <!-- SUBJECT PROGRESS -->
  <div class="grid">

    <div class="subject">
      <h3>FLAT</h3>
      <p id="flat">0%</p>
    </div>

    <div class="subject">
      <h3>DAA</h3>
      <p id="daa">0%</p>
    </div>

    <div class="subject">
      <h3>Aptitude</h3>
      <p id="aptitude">0%</p>
    </div>

  </div>

  <!-- GRAPH -->
  <div class="card">
  <h3>Performance Analytics</h3>
  <div style="height:300px;">
    <canvas id="chart"></canvas>
  </div>
</div>
</div>

<!-- PROFILE -->
<div id="profile" style="display:none;">
  <h2>Profile</h2>
  <input id="pname" placeholder="Name">
  <input id="pemail" placeholder="Email">
  <button onclick="saveProfile()">Save</button>
</div>

<script>

// ===== FIREBASE =====
const firebaseConfig = {
 apiKey: "AIzaSyBBydrD1fBG7H47qsozUxHFuxlbWH8DSaE",
 authDomain: "neolearnn-69e67.firebaseapp.com",
 projectId: "neolearnn-69e67",
 storageBucket: "neolearnn-69e67.firebasestorage.app",
 messagingSenderId: "632656148768",
 appId: "1:632656148768:web:bcb4d4355e93138c84bf45",
 measurementId: "G-PBLVPV38T6"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let userRef = null;

function goFullPage(page){
  window.top.location.href = page;
}

auth.onAuthStateChanged(user=>{
  if(!user){
    goFullPage("login.html");
    return;
  }
  userRef = db.collection("users").doc(user.uid);
  loadUser();
});

function loadUser(){
  userRef.get().then(doc=>{
    const data = doc.data() || {};

    document.getElementById("name").innerText = data.name || "User";
    document.getElementById("email").innerText = data.email || "";
    document.getElementById("pname").value = data.name || "";
    document.getElementById("pemail").value = data.email || "";

    let subjects = {
      FLAT:0,
      DAA:0,
      APTITUDE:0
    };

    if(data.quizProgress){
      subjects.FLAT = data.quizProgress.FLAT?.percent || 0;
      subjects.DAA = data.quizProgress.DAA?.percent || 0;
      subjects.APTITUDE = data.quizProgress.APTITUDE?.percent || 0;
    }

    document.getElementById("flat").innerText = subjects.FLAT + "%";
    document.getElementById("daa").innerText = subjects.DAA + "%";
    document.getElementById("aptitude").innerText = subjects.APTITUDE + "%";

    drawChart(subjects);
  });
}

function saveProfile(){
  userRef.set({
    name: document.getElementById("pname").value,
    email: document.getElementById("pemail").value
  }, {merge:true});
  alert("Profile Updated");
}

function showDash(){
  document.getElementById("dash").style.display="block";
  document.getElementById("profile").style.display="none";
}
function showProfile(){
  document.getElementById("dash").style.display="none";
  document.getElementById("profile").style.display="block";
}

async function logout(){
  try{
    await auth.signOut();
    localStorage.clear();
    sessionStorage.clear();
    goFullPage("login.html");
  }catch(err){
    console.error("Logout Error:", err);
  }
}

let chartInstance = null;

function drawChart(sub){

  const canvas = document.getElementById("chart");
  if(!canvas) return;

  const ctx = canvas.getContext("2d");

  // 🛑 destroy old chart safely
  if(chartInstance){
    chartInstance.destroy();
  }

  // 🛑 ensure parent height
  canvas.parentElement.style.height = "300px";

  chartInstance = new Chart(ctx,{
    type:"bar",
    data:{
      labels:["FLAT","DAA","APTITUDE"],
      datasets:[{
        label:"Progress %",
        data:[
          Number(sub.FLAT),
          Number(sub.DAA),
          Number(sub.APTITUDE)
        ],
        borderRadius:8,
        barThickness:40,
        backgroundColor:[
          "#00f5c4",
          "#ff4d6d",
          "#ffd700"
        ]
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{
          labels:{
            color:"white"
          }
        }
      },
      scales:{
        x:{
          ticks:{ color:"white" },
          grid:{ display:false }
        },
        y:{
          beginAtZero:true,
          max:100,
          ticks:{ color:"white" },
          grid:{ color:"rgba(255,255,255,0.1)" }
        }
      }
    }
  });
}
</script>

</body>
</html>
