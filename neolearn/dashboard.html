<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NeoLearn Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

/* BACKGROUND */
body{
    background: radial-gradient(circle at top,#0a0a0a,#000);
    color:white;
    overflow-x:hidden;
}

/* CONTAINER */
.container{
    display:flex;
}

/* ================= SIDEBAR PREMIUM ================= */
.sidebar{
    width:240px;
    height:100vh;
    background:rgba(20,20,20,0.7);
    backdrop-filter:blur(25px);
    padding:25px;
    border-right:1px solid rgba(255,255,255,0.05);
}

.sidebar h2{
    color:#00f5c4;
    margin-bottom:25px;
    font-size:22px;
    letter-spacing:1px;
}

/* NAV ITEMS */
.sidebar a{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 15px;
    margin:8px 0;
    border-radius:12px;
    color:#aaa;
    cursor:pointer;
    font-size:15px;
    transition:0.3s;
}

.sidebar a:hover{
    background:#111;
    color:white;
    transform:translateX(6px);
}

/* ACTIVE */
.active{
    background:linear-gradient(90deg,#00f5c4,#00aaff);
    color:black!important;
    font-weight:600;
    box-shadow:0 0 15px rgba(0,245,196,0.4);
}

/* LOGOUT BUTTON */
.sidebar button{
    width:100%;
    margin-top:20px;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#ff3b3b;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

.sidebar button:hover{
    background:#ff1a1a;
    transform:scale(1.05);
}

/* ================= MAIN ================= */
.main{
    flex:1;
    padding:30px;
}

/* ================= CARDS ================= */
.cards{
    display:flex;
    gap:20px;
    margin-top:20px;
}

.card{
    flex:1;
    padding:20px;
    border-radius:18px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.06);
    backdrop-filter:blur(10px);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
    margin-top:20px;
}

/* ================= TEXTAREA ================= */
textarea{
    width:100%;
    height:140px;
    margin:10px 0;
    padding:15px;
    background:#111;
    color:white;
    border:none;
    border-radius:12px;
    outline:none;
    transition:0.3s;
}

textarea:focus{
    box-shadow:0 0 10px #00f5c4;
}

/* ================= CHAT PANEL ================= */
.chat{
    position:fixed;
    right:-400px;
    top:0;
    width:400px;
    height:100%;
    background:rgba(0,0,0,0.9);
    backdrop-filter:blur(20px);
    transition:0.4s;
    display:flex;
    flex-direction:column;
    z-index:999;
}

.chat.active{
    right:0;
}

.chat-header{
    padding:15px;
    background:linear-gradient(90deg,#00f5c4,#00aaff);
    color:black;
    font-weight:600;
}

/* ================= PROFILE ================= */
.profile-card{
    display:flex;
    background: rgba(30,30,30,0.9);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    gap: 30px;
    align-items: center;
    max-width: 800px;
    margin-top: 20px;
}

.profile-left{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 15px;
}

.profile-left .avatar{
    width:150px;
    height:150px;
    border-radius:50%;
    border: 4px solid #00f5c4;
    object-fit:cover;
}

.profile-right{
    display:flex;
    flex-direction:column;
    gap: 15px;
    color:#ccc;
}

.profile-right h3{
    font-size:24px;
    color:white;
}

/* BUTTONS */
.profile-buttons button{
    padding:10px 18px;
    border:none;
    border-radius:12px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.profile-buttons button:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 20px rgba(0,0,0,0.5);
}

/* ================= QUIZ ================= */
.moduleBox{
    padding:25px;
    border-radius:18px;
    background:#111;
    cursor:pointer;
    text-align:center;
    transition:0.3s;
}

.moduleBox:hover{
    transform:translateY(-6px) scale(1.02);
    box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

/* QUIZ OPTIONS */
#quizContainer .options button{
    background:#00aaff;
    color:#fff;
    border:none;
    padding:10px 15px;
    margin:5px;
    border-radius:12px;
    cursor:pointer;
    transition:0.3s;
}

#quizContainer .options button:hover{
    background:#00f5c4;
    transform:translateY(-2px);
}

/* SCORE BOX */
#quizScoreBox{
    font-size:18px;
    font-weight:600;
    text-align:center;
}

/* RESPONSIVE */
@media(max-width:700px){
    .sidebar{display:none;}
    .container{flex-direction:column;}
}

/* 🔥 RESET LINK COLORS (VERY IMPORTANT) */
.nav-item,
.nav-item:link,
.nav-item:visited,
.nav-item:active{
    text-decoration:none;
    color:#9aa4b2;
}

/* BASE ITEM */
.nav-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    border-radius:12px;
    cursor:pointer;
    transition:all 0.25s ease;
    font-weight:500;
}

/* HOVER */
.nav-item:hover{
    background:rgba(255,255,255,0.04);
    color:#ffffff;
}

/* 🔥 ACTIVE (FINAL FIX) */
.nav-item.active,
.nav-item.active:link,
.nav-item.active:visited,
.nav-item.active:active{
    background:rgba(0, 245, 196, 0.08);
    color:#ffffff !important;   /* 🔥 FORCE WHITE */
    border:1px solid rgba(0,245,196,0.25);
    backdrop-filter:blur(8px);
}

/* 🔥 FORCE TEXT INSIDE */
.nav-item.active span{
    color:#ffffff !important;
}

/* ICON TEXT */
.nav-item span{
    font-size:14px;
}

/* AI BUTTON SPECIAL */
.ai-btn.active{
    background:linear-gradient(135deg, rgba(0,245,196,0.15), rgba(0,170,255,0.15));
    border:1px solid rgba(216, 222, 225, 0.3);
    color:#4fd1ff !important;
}

.ai-btn.active span{
    color:#4fd1ff !important;
}
.logo{
  display:flex;
  justify-content:center;
  align-items:center;
  width:100%;          /* 🔥 ensures full width */
  margin:10px 0 20px;
}

/* LOGO IMAGE */
.logo img{
  width:130px;
  height:auto;
  object-fit:contain;
  display:block;
  margin:auto;         /* 🔥 perfect center */
  transition:all 0.3s ease;
  filter: drop-shadow(0 4px 12px rgba(0,245,196,0.15));
}

/* HOVER (premium subtle effect) */
.logo img:hover{
  transform:scale(1.06);
  filter: drop-shadow(0 8px 20px rgba(0,245,196,0.25));
}
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.313/pdf.min.js"></script>
<div class="container">   
   <div class="sidebar">
    <div class="logo">
  <img src="logo neo.png" alt="NeoLearn Logo">
</div>

  <a onclick="showSection('settings', this)" class="nav-item">
    ⚙️ <span>Settings</span>
</a>

<a class="nav-item active" onclick="showSection('dashboard', this)">
    📊 <span>Dashboard</span>
</a>

<a onclick="showSection('modules', this)" class="nav-item">
    🧠 <span>AI Visualization</span>
</a>

<a onclick="showSection('quiz', this)" class="nav-item">
    📝 <span>Quiz</span>
</a>

<a onclick="showSection('notes', this)" class="nav-item">
    📄 <span>Summarization</span>
</a>

<a onclick="showSection('analytics', this)" class="nav-item">
    📈 <span>Analytics</span>
</a>

<a onclick="showSection('chat', this)" class="nav-item ai-btn">
    🤖 <span>AI Assistant</span>
</a>

    <!-- LOGOUT -->
   <button onclick="logout()" class="logout-btn">🚪 Logout</button>

</div>

<div class="main">
<h2 id="welcome"></h2>

<!-- SETTINGS -->
<div id="settingsSection" style="display:none;">
     <h2>👤Profile</h2>

    <iframe 
        src="profile.html" 
        style="width:100%; height:700px; border:none; border-radius:12px; background:#111;">
    </iframe>
</div>

<!-- DASHBOARD -->
<div id="dashboardSection">
  <h2></h2>

    <iframe 
        src="dash.html" 
        style="width:100%; height:700px; border:none; border-radius:12px; background:#111;">
    </iframe>
</div>

<!-- MODULES SECTION -->
<div id="modulesSection" style="display:none;">
    <h2>📚AI Visualization</h2>

    <iframe 
        src="test.html" 
        style="width:100%; height:700px; border:none; border-radius:12px; background:#111;">
    </iframe>
</div>
<!-- QUIZ -->
 
<div id="quizSection" style="display:none; flex-direction:column; gap:20px;">
    <h2>📝Quiz</h2>

    <iframe 
        src="quizzes.html" 
        style="width:100%; height:700px; border:none; border-radius:12px; background:#111;">
    </iframe>

</div>
<!-- NOTES -->
<!-- NOTES SIDE PANEL -->
<div id="notesSection" style="display:none;">
    <h2>Summarization</h2>

    <iframe 
        src="notes.html" 
        style="width:100%; height:700px; border:none; border-radius:12px; background:#111;">
    </iframe>

</div>
 

 
<!-- ANALYTICS -->
<div id="analyticsSection" style="display:none;">
   <h2>📈</h2>

    <iframe 
        src="analytics.html" 
        style="width:100%; height:700px; border:none; border-radius:12px; background:#111;">
    </iframe>

</div>

<!-- CHAT -->
<div id="chatSection" style="display:none;">
    <h2>🤖AI </h2>

    <iframe 
        src="chat.html" 
        style="width:100%; height:700px; border:none; border-radius:12px; background:#111;">
    </iframe>
</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// ===== FIREBASE =====
const firebaseConfig = {
  apiKey: "AIzaSyBBydrD1fBG7H47qsozUxHFuxlbWH8DSaE",
  authDomain: "neolearnn-69e67.firebaseapp.com",
  projectId: "neolearnn-69e67",
  storageBucket: "neolearnn-69e67.firebasestorage.app",
  messagingSenderId: "632656148768",
  appId: "1:632656148768:web:bcb4d4355e93138c84bf45",
  measurementId: "G-PBLVPV38T6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// ================= NAVIGATION =================
function showSection(section, el){

    ["dashboard","modules","quiz","notes","analytics","settings","chat"].forEach(x => {
        let sec = document.getElementById(x + "Section");
        if(sec) sec.style.display = "none";
    });

    let target = document.getElementById(section + "Section");
    if(target) target.style.display = "block";

    // ACTIVE BUTTON FIX 🔥
    document.querySelectorAll(".nav-item").forEach(btn=>{
        btn.classList.remove("active");
    });

    if(el) el.classList.add("active");
}

// 🔥 IMPORTANT (make it global for onclick)
window.showSection = showSection;


// ================= QUIZ =================
let quizQuestions = [];
let currentQuizIndex = 0;
let quizAnswers = [];
let quizTimerInterval;
let quizTimeLeft = 15*60;

const quizQuestionBox = document.getElementById("quizQuestionBox");
const quizTimerEl = document.getElementById("quizTimer");
const quizPrevBtn = document.getElementById("quizPrevBtn");
const quizNextBtn = document.getElementById("quizNextBtn");
const quizScoreBox = document.getElementById("quizScoreBox");
const quizContainer = document.getElementById("quizContainer");
const quizModuleTitle = document.getElementById("quizModuleTitle");
const quizModulesDiv = document.getElementById("quizModules");

const flatQuestions = [
  {question:"DFA → RegEx conversion is done by?", options:["Brzozowski","Arden","Walter","All"], answer:"Brzozowski"},
];

const daaQuestions = [
  {question:"Stack insertion is?", options:["Push","Pop","Insert","Create"], answer:"Push"},
];

const aptitudeQuestions = [
  {question:"Which is not prime?", options:["31","61","71","91"], answer:"91"},
];

function shuffleArray(arr){ return arr.sort(()=>Math.random()-0.5); }

function startQuiz(moduleName){
  if(!quizModulesDiv || !quizContainer) return;

  quizModulesDiv.style.display="none";
  quizContainer.style.display="flex";
  quizModuleTitle.innerText=moduleName;

  currentQuizIndex=0;
  quizAnswers=[];
  quizTimeLeft=15*60;
  clearInterval(quizTimerInterval);

  if(moduleName==="FLAT") quizQuestions = shuffleArray([...flatQuestions]);
  if(moduleName==="DAA") quizQuestions = shuffleArray([...daaQuestions]);
  if(moduleName==="Aptitude") quizQuestions = shuffleArray([...aptitudeQuestions]);

  loadQuizQuestion();
  quizTimerInterval = setInterval(updateQuizTimer,1000);
}

function updateQuizTimer(){
  if(!quizTimerEl) return;

  let min=Math.floor(quizTimeLeft/60);
  let sec=quizTimeLeft%60;
  quizTimerEl.innerText=`Time: ${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;

  if(quizTimeLeft<=0){
    clearInterval(quizTimerInterval);
    showQuizScore();
  }
  quizTimeLeft--;
}

function loadQuizQuestion(){
  if(!quizQuestionBox) return;

  const q=quizQuestions[currentQuizIndex];
  quizQuestionBox.innerHTML=`<p><b>Q${currentQuizIndex+1}:</b> ${q.question}</p>`;

  const optionsHTML = shuffleArray([...q.options])
    .map(opt=>`<button onclick="selectQuizAnswer('${opt}')">${opt}</button>`)
    .join('');

  quizQuestionBox.innerHTML+=`<div class="options">${optionsHTML}</div>`;
}

function selectQuizAnswer(opt){
  quizAnswers[currentQuizIndex]=opt;
}
window.selectQuizAnswer = selectQuizAnswer;

function nextQuizQuestion(){
  if(currentQuizIndex<quizQuestions.length-1){
    currentQuizIndex++;
    loadQuizQuestion();
  } else showQuizScore();
}

function prevQuizQuestion(){
  if(currentQuizIndex>0){
    currentQuizIndex--;
    loadQuizQuestion();
  }
}

function showQuizScore(){
  clearInterval(quizTimerInterval);
  let score = quizAnswers.filter((a,i)=>a===quizQuestions[i].answer).length;
  if(quizScoreBox){
    quizScoreBox.innerHTML=`🎯 Score: ${score}/${quizQuestions.length}`;
  }
}

// SAFE EVENTS
if(quizModulesDiv){
  quizModulesDiv.querySelectorAll(".moduleBox").forEach(m=>{
    m.addEventListener("click",()=>startQuiz(m.dataset.module));
  });
}

if(quizNextBtn) quizNextBtn.addEventListener("click",nextQuizQuestion);
if(quizPrevBtn) quizPrevBtn.addEventListener("click",prevQuizQuestion);


// ================= NOTES =================
window.copySummary = function(){
    const el = document.querySelector("#summaryOutput p");
    if(!el) return;
    navigator.clipboard.writeText(el.innerText);
    alert("Copied ✅");
};


// ================= THEME =================
window.toggleTheme = function(){
    document.body.classList.toggle("light");
};


// ================= LOGOUT (FINAL 🔥) =================
window.logout = async function () {
  try {
    await signOut(auth);

    localStorage.clear();
    sessionStorage.clear();

    // 🔥 BREAK iframe + FULL PAGE
    window.top.location.href = "login.html";

  } catch (err) {
    console.error("Logout failed:", err);
    alert("Logout failed");
  }
};


// ================= PROFILE =================
window.changePassword = function(){
    let newPass=prompt("Enter new password:");
    if(!newPass) return;
    alert("Password updated (backend pending)");
};

window.changeEmail = function(){
    let newEmail=prompt("Enter new email:");
    if(!newEmail) return;
    document.getElementById("profileEmail").innerText=newEmail;
};

</script>
</body>
</html>
